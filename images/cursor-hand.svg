<svg xmlns="http://www.w3.org/2000/svg" width="22" height="28" viewBox="0 0 22 28">
  <!-- palm base (drawn first so fingers sit on top) -->
  <rect x="1" y="14" width="20" height="12" rx="5" fill="white" stroke="black" stroke-width="1.5"/>
  <!-- ring finger (left) -->
  <rect x="1" y="8" width="6" height="11" rx="3" fill="white" stroke="black" stroke-width="1.5"/>
  <!-- middle finger (right) -->
  <rect x="15" y="5" width="6" height="13" rx="3" fill="white" stroke="black" stroke-width="1.5"/>
  <!-- index finger (center, extended, drawn last so it's on top) -->
  <rect x="7.5" y="0" width="7" height="18" rx="3.5" fill="white" stroke="black" stroke-width="1.5"/>
  <!-- cover seams between fingers and palm -->
  <rect x="2" y="16" width="18" height="4" fill="white"/>
  <rect x="8" y="15" width="6" height="4" fill="white"/>
</svg>
